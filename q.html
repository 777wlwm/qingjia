<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden; /* 防止手机产生滚动条 */
  }
  body {
    height: 100dvh; /* 手机动态视口高度，不会被地址栏挡住 */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #e2e8f0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    padding: 10px; /* 给屏幕边缘留点空隙 */
  }
  .panel {
    display: flex;
    gap: 32px;
    margin-bottom: 12px;
    font-size: 16px;
    flex-shrink: 0;
  }
  .panel span b { color: #4ade80; font-size: 20px; margin-left: 4px; }
  /* 核心修改：让画布自适应手机宽度 */
  #game {
    background: #1e293b;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
    display: block;
    touch-action: none;
    width: 100%;       /* 宽度占满父容器 */
    max-width: 480px;  /* 最大不超过 480px */
    height: auto;      /* 高度自动按比例缩放 */
    aspect-ratio: 1 / 1;
  }
  .hint { margin-top: 14px; font-size: 13px; color: #64748b; text-align: center; line-height: 1.8; flex-shrink: 0;}
  .hint b { color: #94a3b8; }
</style>
</head>
<body>
<div class="panel">
  <span>得分 <b id="score">0</b></span>
  <span>最高分 <b id="best">0</b></span>
</div>
<canvas id="game" width="480" height="480"></canvas>
<div class="hint">
  <b>触屏滑动</b> 控制方向 &nbsp;·&nbsp; <b>点击屏幕</b> 暂停 / 开始 / 重开
</div>
<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');

  const CELL = 24;                 
  const COLS = canvas.width / CELL;   
  const ROWS = canvas.height / CELL;  
  const BASE_INTERVAL = 150;       
  const MIN_INTERVAL = 60;         
  const SPEEDUP = 4;               

  let snake, dir, nextDir, food, score, best, state, acc, last, stepInterval;

  best = parseInt(localStorage.getItem('snake_best') || '0', 10);
  bestEl.textContent = best;

  function reset() {
    snake = [{x: 9, y: 10}, {x: 8, y: 10}, {x: 7, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    score = 0;
    stepInterval = BASE_INTERVAL;
    acc = 0;
    scoreEl.textContent = '0';
    placeFood();
    state = 'ready';
  }

  function placeFood() {
    while (true) {
      const p = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
      if (!snake.some(s => s.x === p.x && s.y === p.y)) { food = p; return; }
    }
  }

  function setDir(nx, ny) {
    if ((nx === -dir.x && ny === -dir.y) || (nx === dir.x && ny === dir.y)) return;
    nextDir = {x: nx, y: ny};
  }

  function step() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      stepInterval = Math.max(MIN_INTERVAL, stepInterval - SPEEDUP);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    state = 'over';
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('snake_best', String(best));
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(148,163,184,.07)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
    }
    for (let i = 1; i < ROWS; i++) {
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }

    ctx.fillStyle = '#f87171';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#7f1d1d';
    ctx.fillRect(food.x * CELL + CELL / 2 - 1, food.y * CELL + 3, 2, 5);

    snake.forEach((s, i) => {
      const t = i / Math.max(snake.length - 1, 1);
      const g = Math.round(74 + (134 - 74) * t);
      ctx.fillStyle = i === 0 ? '#4ade80' : 'rgb(34,' + g + ',94)';
      const pad = 2, r = 5;
      const x = s.x * CELL + pad, y = s.y * CELL + pad, w = CELL - pad * 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + w, r);
      ctx.arcTo(x + w, y + w, x, y + w, r);
      ctx.arcTo(x, y + w, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.fill();
      if (i === 0) {
        ctx.fillStyle = '#052e16';
        const cx = s.x * CELL + CELL / 2, cy = s.y * CELL + CELL / 2;
        const ex = dir.x * 4, ey = dir.y * 4;
        const px = -dir.y * 5, py = -dir.x * 5;
        ctx.beginPath(); ctx.arc(cx + ex + px, cy + ey + py, 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + ex - px, cy + ey - py, 2.2, 0, Math.PI * 2); ctx.fill();
      }
    });

    if (state === 'ready') overlay('贪吃蛇', '触屏滑动开始');
    else if (state === 'paused') overlay('已暂停', '点击屏幕继续');
    else if (state === 'over') overlay('游戏结束', '得分 ' + score + (score >= best && score > 0 ? ' · 新纪录！' : '') + '\n点击屏幕重新开始');
  }

  function overlay(title, sub) {
    ctx.fillStyle = 'rgba(15,23,42,.78)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f1f5f9';
    ctx.font = 'bold 34px "Microsoft YaHei", sans-serif';
    ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 20);
    ctx.font = '15px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#94a3b8';
    sub.split('\n').forEach((line, i) => {
      ctx.fillText(line, canvas.width / 2, canvas.height / 2 + 16 + i * 24);
    });
  }

  function loop(ts) {
    if (!last) last = ts;
    const dt = ts - last;
    last = ts;

    if (state === 'playing') {
      acc += dt;
      if (acc >= stepInterval) { acc -= stepInterval; step(); }
    }
    draw();
    requestAnimationFrame(loop);
  }

  function startOrRestart() {
    if (state === 'ready' || state === 'over') { reset(); state = 'playing'; }
    else if (state === 'playing') { state = 'paused'; }
    else if (state === 'paused') { state = 'playing'; }
  }

  // 触屏滑动 & 点击
  let tsx = 0, tsy = 0;
  canvas.addEventListener('touchstart', e => {
    tsx = e.touches[0].clientX; tsy = e.touches[0].clientY;
  }, {passive: true});

  canvas.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tsx;
    const dy = e.changedTouches[0].clientY - tsy;
    
    // 如果刚刚开始、暂停或结束，触摸屏幕直接开始/继续/重开
    if (state === 'ready' || state === 'over' || state === 'paused') { 
      startOrRestart(); 
      return; 
    }
    
    // 滑动距离太小，当作点击处理，不改变方向
    if (Math.abs(dx) < 15 && Math.abs(dy) < 15) return;
    
    // 根据滑动方向改变方向
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  }, {passive: true});

  // 键盘支持（保留给电脑用）
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
    if (k === 'arrowup' || k === 'w') setDir(0, -1);
    else if (k === 'arrowdown' || k === 's') setDir(0, 1);
    else if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
    else if (k === 'arrowright' || k === 'd') setDir(1, 0);
    else if (k === ' ') startOrRestart();
    if (state === 'ready' && (k.startsWith('arrow') || 'wasd'.includes(k))) {
      reset(); state = 'playing';
    }
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
